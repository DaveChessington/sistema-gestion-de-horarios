<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Gestión de horarios · UDL{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/schedule.css') }}" />
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}min-h-screen bg-slate-50 text-slate-900{% endblock %}"{% block body_attributes %}{% endblock %}>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
