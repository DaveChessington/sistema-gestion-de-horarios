[pytest]
# Configuración de pytest
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = -v --tb=short --strict-markers
markers =
    unit: Pruebas unitarias
    integration: Pruebas de integración
    security: Pruebas de seguridad
    slow: Pruebas lentas
