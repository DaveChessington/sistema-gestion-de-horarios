services:
  postgres_db:
    image: postgres:16-alpine
    container_name: gestion_horarios_udl
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-gestion_horarios_udl}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net

  iam:
    build:
      context: ./iam
      dockerfile: Dockerfile
    container_name: iam
    restart: always
    ports:
      - "${IAM_PORT:-5001}:5000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-gestion_horarios_udl}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - postgres_db
    networks:
      - backend_net

volumes:
  postgres_data:

networks:
  backend_net:
    driver: bridge
